name: interlight
description: A new Flutter project for healthy rhythm and fasting.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  http: ^1.1.0
  camera: ^0.10.5+5
  path_provider: ^2.1.0
  timezone: ^0.10.1
  flutter_timezone:
    path: packages/flutter_timezone
  image: ^4.1.3
  permission_handler: ^12.0.1
  image_picker: ^1.0.4
  flutter_local_notifications: ^19.0.0
  health: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

